<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
{{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}{{ end }}">
  <a class="saltar" href="#main-content">Saltar al contenido</a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/main.js" | resources.Fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
