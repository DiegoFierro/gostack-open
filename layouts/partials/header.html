<header class="cabecera">
  <div class="contenedor cabecera__fila">
    <a class="marca" href="{{ "" | relURL }}"><span aria-hidden="true">&gt;_</span> GoStack Open</a>
    <button class="menu-boton" aria-expanded="false" aria-controls="menu-principal">Menú</button>
    <nav id="menu-principal" class="menu" aria-label="Principal">
      <ul>
        {{- $actual := . }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($actual.IsMenuCurrent "main" .) ($actual.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        <li><a href="{{ site.Params.repositorio }}" rel="noopener">Código fuente ↗</a></li>
      </ul>
    </nav>
  </div>
</header>
