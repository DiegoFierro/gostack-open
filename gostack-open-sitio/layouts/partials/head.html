<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- $titulo := cond .IsHome site.Title (printf "%s — %s" .Title site.Title) }}
<title>{{ $titulo }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.descripcion }}{{ end }}">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<meta property="og:title" content="{{ $titulo }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.descripcion }}{{ end }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
{{- $css := slice (resources.Get "css/main.css") (resources.Get "css/chroma-light.css") (resources.Get "css/chroma-dark.css") | resources.Concat "css/estilos.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
