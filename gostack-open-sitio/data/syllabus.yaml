fases:
  - nombre: "Fase -1 & 0: Fundamentos, terminal y mentalidad Go"
    resumen: "Terminal, Git, la web, HTTP y los fundamentos del lenguaje Go."
    modulos:
      - id: "-01"
        titulo: "Fundamentos de la Terminal & Entorno CLI"
        leccion: "01-modulo-menos-01"
        temas:
          - "¿Qué es una interfaz de comandos y cómo interactúa con el sistema operativo?"
          - "Navegación de directorios, creación, edición y gestión de archivos desde la terminal."
          - "Permisos, variables de entorno y control de versiones con Git y GitHub desde cero."
      - id: "-00"
        titulo: "Fundamentos de la Web & Protocolo HTTP"
        leccion: "02-modulo-menos-00"
        temas:
          - "¿Cómo funciona internet? Clientes, servidores, IPs y dominios."
          - "Anatomía del protocolo HTTP: Métodos (GET, POST, PUT, DELETE), cabeceras y códigos de estado."
          - "El ciclo de vida de una petición web y la filosofía de la hipermedia."
      - id: "00"
        titulo: "Entorno de Desarrollo, Toolchain & Mentalidad Go"
        leccion: "03-modulo-00"
        temas:
          - "Instalación y configuración del toolchain oficial de Go."
          - "Gestión de dependencias con Go Modules (`go.mod`, `go.sum`)."
          - "Análisis estático con `golangci-lint`, formateo automático con `gofmt`."
          - "El cambio de paradigma: pensamiento explícito frente a la magia de otros lenguajes."
      - id: "01"
        titulo: "Fundamentos del Lenguaje, Punteros & Memoria"
        leccion: "04-modulo-01"
        temas:
          - "Sintaxis básica, control de flujo, funciones y retornos múltiples."
          - "Estructuras de datos nativas: arrays y slices ([]T) y su gestión en memoria (backing array, len, cap)."
          - "Mapas (map[K]V) y el uso explícito de punteros para eficiencia y mutabilidad."
      - id: "02"
        titulo: "Composición, Interfaces Implícitas & Manejo de Errores"
        leccion: "05-modulo-02"
        temas:
          - "El fin de la herencia clásica: diseño mediante structs y métodos."
          - "Interfaces implícitas (duck typing estático) y aserción de tipos."
          - "Manejo idiomático de errores como valores (`if err != nil`)."
          - "Composición de errores con `fmt.Errorf`, `errors.Is` y `errors.As`."
  - nombre: "Fase 1: Arquitectura, configuración y web hipermedia"
    resumen: "Configuración tipada, arquitectura limpia, servidores nativos y HTMX."
    modulos:
      - id: "03"
        titulo: "Configuración Tipada & Arquitectura de Proyectos"
        leccion: "06-modulo-03"
        temas:
          - "Carga de variables de entorno tipadas y seguras con `envconfig` / `cleanenv` (validación en arranque)."
          - "Estructuración de paquetes en Go (Clean Architecture / Domain-Driven pragmático)."
          - "Desacoplamiento mediante el Patrón Repository."
      - id: "04"
        titulo: "Servidores Web Nativos & Filosofía Hipermedia"
        leccion: "07-modulo-04"
        temas:
          - "El paquete nativo `net/http` y el enrutador avanzado de Go (métodos, comodines y patrones)."
          - "Creación de middlewares personalizados implementando `http.Handler`."
          - "Renderizado de plantillas HTML en el servidor usando `html/template`."
      - id: "05"
        titulo: "Interfaz Interactiva sin JavaScript (HTMX & View Transitions)"
        leccion: "08-modulo-05"
        temas:
          - "Integración de HTMX en el ecosistema Go: peticiones AJAX desde HTML y fragmentos (partials)."
          - "Componentes nativos de HTML5 (diálogos, acordeones)."
          - "Transiciones de página fluidas con la API View Transitions sin escribir JavaScript complejo."
  - nombre: "Fase 2: Bases de datos, estado y concurrencia"
    resumen: "PostgreSQL con sqlc, formularios dinámicos y concurrencia nativa."
    modulos:
      - id: "06"
        titulo: "Persistencia Relacional & SQL Tipado con sqlc"
        leccion: "09-modulo-06"
        temas:
          - "Conexión a PostgreSQL mediante `database/sql` y el driver de alto rendimiento `pgx`."
          - "Gestión y ejecución de migraciones con `golang-migrate`."
          - "Generación automática de código Go fuertemente tipado a partir de SQL puro con `sqlc`."
      - id: "07"
        titulo: "Formularios Dinámicos, OOB Swaps & Estado de Interfaz"
        leccion: "10-modulo-07"
        temas:
          - "Validación de formularios en el servidor con respuestas estructuradas y errores en línea."
          - "Actualizaciones parciales de múltiples zonas de la pantalla con Out-of-Band (OOB) Swaps de HTMX."
          - "Tablas interactivas con filtrado y paginación del lado del servidor."
      - id: "08"
        titulo: "El Superpoder de Go: Concurrencia Nativa (CSP)"
        leccion: "11-modulo-08"
        temas:
          - "Modelo de concurrencia CSP (Communicating Sequential Processes)."
          - "Lanzamiento y gestión de Goroutines."
          - "Comunicación segura mediante Channels (buffered / unbuffered) y patrón `select`."
          - "Prevención de condiciones de carrera (Race Detector), sincronización con `sync.WaitGroup` y `sync.Mutex`."
          - "Cancelación y control de tiempos con `context.Context`."
  - nombre: "Fase 3: Seguridad, APIs y tiempo real"
    resumen: "Autenticación, APIs con OpenAPI, WebSockets y colas de tareas."
    modulos:
      - id: "09"
        titulo: "Autenticación, Sesiones & Seguridad Web"
        leccion: "12-modulo-09"
        temas:
          - "Gestión segura de sesiones mediante cookies HTTP (HttpOnly, Secure, SameSite)."
          - "Emisión y verificación de tokens JWT para autenticación de APIs."
          - "Control de acceso basado en roles (RBAC)."
          - "Hashing seguro de credenciales con Argon2id y mitigación de vulnerabilidades (CSRF, XSS, SQLi)."
      - id: "10"
        titulo: "Especialización de APIs: OpenAPI & Generación de Código (`oapi-codegen`)"
        leccion: "13-modulo-10"
        temas:
          - "Diseño de APIs REST JSON bajo el enfoque “API-First” usando OpenAPI 3.0 (YAML)."
          - "Generación automática del servidor y tipados en Go con `oapi-codegen`."
          - "Empaquetado e integración de interfaces visuales interactivas (Swagger UI) dentro del binario con `go:embed`."
      - id: "11"
        titulo: "Comunicación en Tiempo Real & Tareas en Segundo Plano"
        leccion: "14-modulo-11"
        temas:
          - "WebSockets nativos en Go integrados con la extensión de WebSocket de HTMX (`hx-ws` / `ws`)."
          - "Procesamiento asíncrono de colas de tareas background con `Asynq` respaldado por Redis."
  - nombre: "Fase 4: Rendimiento, observabilidad, escritorio y producción"
    resumen: "Rendimiento, observabilidad, pruebas, Wails, Fyne y despliegue."
    modulos:
      - id: "12"
        titulo: "Rendimiento, Caché & Optimización"
        leccion: "15-modulo-12"
        temas:
          - "Estrategias de caché en memoria y con Redis."
          - "Compresión HTTP y carga diferida (lazy loading) con HTMX."
          - "Optimización de memoria en Go y prevención del problema N+1 en consultas SQL."
      - id: "13"
        titulo: "Observabilidad en Producción: Logging Estructurado & Métricas"
        leccion: "16-modulo-13"
        temas:
          - "Uso del paquete nativo `log/slog` para registros estructurados en JSON con contexto."
          - "Instrumentación de métricas de salud y rendimiento con Prometheus y OpenTelemetry."
      - id: "14"
        titulo: "Testing, Calidad de Software & Benchmarks"
        leccion: "17-modulo-14"
        temas:
          - "Pruebas unitarias e integración con el paquete nativo `testing`."
          - "Simulación de servidores HTTP con `net/http/httptest`."
          - "Pruebas de rendimiento con benchmarks (`go test -bench`) y Fuzz Testing nativo."
      - id: "15"
        titulo: "Desarrollo de Apps de Escritorio con Go y Wails"
        leccion: "18-modulo-15"
        temas:
          - "Empaquetado del backend de Go junto con interfaces web modernas (HTML/CSS/JS) en ejecutables nativos (`.exe`, `.app`, `.deb`) usando Wails."
          - "Reutilización de la lógica de negocio multiplataforma."
      - id: "16"
        titulo: "Interfaces Nativas & Multiplataforma con Fyne"
        leccion: "19-modulo-16"
        temas:
          - "Construcción de interfaces gráficas nativas y ligeras en Go con Fyne."
          - "Generación de paquetes de instalación para dispositivos móviles (`.apk` para Android)."
      - id: "17"
        titulo: "Despliegue, Contenedores & Producción"
        leccion: "20-modulo-17"
        temas:
          - "Compilación de binarios estáticos ultraligeros sin dependencias (`CGO_ENABLED=0`)."
          - "Creación de imágenes Docker multi-stage optimizadas y orquestación con Docker Compose."
          - "Despliegue protegido y automatizado con servidor web/proxy inverso Caddy (HTTPS automático)."
